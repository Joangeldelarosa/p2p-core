<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p2p-core – Chat Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1c1f2e;
      --surface2: #252838;
      --accent: #6c63ff;
      --accent-dark: #534bd4;
      --text: #e8e9f0;
      --muted: #9093a4;
      --success: #4ade80;
      --warning: #facc15;
      --danger: #f87171;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 { font-size: 2rem; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); margin-top: 6px; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-size: .75rem; }

    .row { display: flex; gap: 10px; margin-bottom: 12px; }
    input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: .95rem;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { background: #444; cursor: default; }
    button.secondary { background: var(--surface2); border: 1px solid #444; }
    button.secondary:hover { background: #2e3244; }
    button.danger { background: #7f1d1d; }
    button.danger:hover { background: #991b1b; }

    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--surface2);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: .9rem;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted);
    }
    .dot.connected { background: var(--success); }
    .dot.connecting { background: var(--warning); }
    .dot.error { background: var(--danger); }

    #chat-area {
      display: none;
      flex-direction: column;
      height: 420px;
    }
    #chat-area.visible { display: flex; }

    #messages {
      flex: 1;
      overflow-y: auto;
      background: var(--surface2);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: .9rem;
      line-height: 1.4;
    }
    .msg.mine {
      align-self: flex-end;
      background: var(--accent);
      border-bottom-right-radius: 4px;
    }
    .msg.theirs {
      align-self: flex-start;
      background: #2e3244;
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      font-size: .72rem;
      color: rgba(255,255,255,.55);
      margin-bottom: 2px;
    }

    #peers-list {
      margin-top: 10px;
      font-size: .85rem;
      color: var(--muted);
    }
    .peer-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface2);
      padding: 4px 10px;
      border-radius: 20px;
      margin: 3px;
      font-size: .8rem;
    }
    .peer-chip::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    #room-url {
      background: var(--surface2);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: .85rem;
      color: var(--accent);
      word-break: break-all;
      cursor: pointer;
      user-select: all;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.host { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed55; }
    .badge.client { background: #0369a122; color: #38bdf8; border: 1px solid #0369a155; }

    .relay-note {
      font-size: .78rem;
      color: var(--warning);
      padding: 6px 12px;
      background: rgba(250,204,21,.08);
      border-radius: 6px;
      border: 1px solid rgba(250,204,21,.25);
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <h1><span>p2p</span>-core</h1>
  <p>WebRTC peer-to-peer chat demo</p>
</header>

<!-- Connection setup -->
<div class="card" id="setup-card">
  <h2>Connect to Signaling Server</h2>
  <div id="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">Not connected</span>
  </div>

  </div>
  <div class="row">

    <button id="btn-list" class="secondary">📋 List Rooms</button>
  </div>

<!-- Active room -->
<div class="card" id="room-card" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <div>
      <strong id="room-label">Room</strong>

<script type="module">
// ─── Inline p2p-core (browser bundle) ────────────────────────────────────────
// In a real project you would: import { P2PCore, ChatPlugin, PresencePlugin } from 'p2p-core';
// For this standalone demo we include a minimal inline implementation.

// ── EventEmitter ──────────────────────────────────────────────────────────────
class EventEmitter {
  constructor() { this._h = new Map(); }
  on(e, fn) {
    if (!this._h.has(e)) this._h.set(e, new Set());
    this._h.get(e).add(fn);
    return () => this.off(e, fn);
  }
  once(e, fn) {
    const w = (d) => { fn(d); this.off(e, w); };
    this.on(e, w);
  }
  off(e, fn) { this._h.get(e)?.delete(fn); }
  emit(e, d) { this._h.get(e)?.forEach(h => h(d)); }
}

// ── SignalingClient ───────────────────────────────────────────────────────────
class SignalingClient extends EventEmitter {
  constructor(url) {
    super();
    this.url = url;
    this.ws = null;
    this.peerId = '';
    this.isConnected = false;
    this._queue = [];
  }

  connect() {
    return new Promise((resolve, reject) => {
      const ws = new WebSocket(this.url);
      this.ws = ws;
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        this._dispatch(msg, resolve);
      };
      ws.onerror = (e) => reject(new Error('WebSocket error'));
      ws.onclose = (e) => {
        this.isConnected = false;
        this.emit('disconnected', { code: e.code, reason: e.reason });
      };
      ws.onopen = () => this._flush();
    });
  }

  disconnect() { this._send({ type: 'disconnect' }); this.ws?.close(1000); }
  createRoom(opts) { this._send({ type: 'create-room', payload: opts }); }
  joinRoom(roomId, pw) { this._send({ type: 'join-room', roomId, payload: { password: pw } }); }
  listRooms() { this._send({ type: 'list-rooms' }); }
  sendOffer(roomId, to, sdp) { this._send({ type: 'offer', roomId, to, payload: { sdp } }); }
  sendAnswer(roomId, to, sdp) { this._send({ type: 'answer', roomId, to, payload: { sdp } }); }
  sendIce(roomId, to, candidate) { this._send({ type: 'ice-candidate', roomId, to, payload: { candidate } }); }
  sendRelay(roomId, to, payload) { this._send({ type: 'relay', roomId, to, payload }); }

  _send(msg) {
    const full = { ...msg, from: this.peerId || undefined };
    if (this.ws?.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify(full));
    } else {
      this._queue.push(full);
    }
  }

  _flush() {
    while (this._queue.length) this.ws.send(JSON.stringify(this._queue.shift()));
  }

  _dispatch(msg, resolveConnect) {
    switch (msg.type) {
      case 'room-created': {
        const p = msg.payload;
        this.peerId = p.peerId;
        this.isConnected = true;
        this._flush();
        resolveConnect?.(p.peerId);
        this.emit('room-created', p);
        break;
      }
      case 'room-joined': {
        const p = msg.payload;
        this.peerId = p.peerId;
        this.isConnected = true;
        this._flush();
        resolveConnect?.(p.peerId);
        this.emit('room-joined', p);
        break;
      }
      case 'peer-joined': this.emit('peer-joined', { roomId: msg.roomId, ...msg.payload }); break;
      case 'peer-left': this.emit('peer-left', { roomId: msg.roomId, ...msg.payload }); break;
      case 'offer': this.emit('offer', { roomId: msg.roomId, from: msg.from, sdp: msg.payload.sdp }); break;
      case 'answer': this.emit('answer', { roomId: msg.roomId, from: msg.from, sdp: msg.payload.sdp }); break;
      case 'ice-candidate': this.emit('ice-candidate', { roomId: msg.roomId, from: msg.from, candidate: msg.payload.candidate }); break;
      case 'relay': this.emit('relay', { roomId: msg.roomId, from: msg.from, payload: msg.payload }); break;
      case 'rooms-list': this.emit('rooms-list', { rooms: msg.payload.rooms ?? [] }); break;
      case 'error': case 'room-full': case 'room-not-found': case 'wrong-password':
        this.emit('error', { code: msg.type, message: msg.payload?.message ?? msg.type });
        break;
    }
  }
}

// ── PeerConnection ────────────────────────────────────────────────────────────
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
];

class Peer extends EventEmitter {
  constructor(peerId) {
    super();
    this.peerId = peerId;
    this._dc = null;
    this._buf = [];
    this._pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    this._pc.onicecandidate = (e) => e.candidate && this.emit('ice', e.candidate.toJSON());
    this._pc.ondatachannel = (e) => { this._dc = e.channel; this._setupDC(); };
    this._pc.onconnectionstatechange = () => {
      if (this._pc.connectionState === 'connected') this.emit('connected', this.peerId);
      if (['failed','closed','disconnected'].includes(this._pc.connectionState))
        this.emit('disconnected', this.peerId);
    };
  }

  async createOffer() {
    this._dc = this._pc.createDataChannel('p2p-core', { ordered: true });
    this._setupDC();
    await this._pc.setLocalDescription(await this._pc.createOffer());
    return this._gatherICE();
  }

  async createAnswer(sdp) {
    await this._pc.setRemoteDescription(new RTCSessionDescription(sdp));
    await this._pc.setLocalDescription(await this._pc.createAnswer());
    for (const c of this._buf) await this._pc.addIceCandidate(new RTCIceCandidate(c));
    this._buf = [];
    return this._gatherICE();
  }

  async applyAnswer(sdp) {
    await this._pc.setRemoteDescription(new RTCSessionDescription(sdp));
    for (const c of this._buf) await this._pc.addIceCandidate(new RTCIceCandidate(c));
    this._buf = [];
  }

  async addICE(c) {
    if (!this._pc.remoteDescription) { this._buf.push(c); return; }
    await this._pc.addIceCandidate(new RTCIceCandidate(c));
  }

  send(msg) {
    if (this._dc?.readyState === 'open') { this._dc.send(JSON.stringify(msg)); return true; }
    return false;
  }

  close() { this._dc?.close(); this._pc.close(); }

  _setupDC() {
    this._dc.onopen = () => { this.emit('connected', this.peerId); };
    this._dc.onclose = () => this.emit('disconnected', this.peerId);
    this._dc.onmessage = (e) => this.emit('message', JSON.parse(e.data));
  }

  _gatherICE() {
    return new Promise((res) => {
      if (this._pc.iceGatheringState === 'complete') return res(this._pc.localDescription);
      const t = setTimeout(() => res(this._pc.localDescription), 10000);
      this._pc.addEventListener('icegatheringstatechange', () => {
        if (this._pc.iceGatheringState === 'complete') { clearTimeout(t); res(this._pc.localDescription); }
      });
    });
  }
}

// ── Room ──────────────────────────────────────────────────────────────────────
class Room extends EventEmitter {
  constructor({ roomId, peerId, isHost, hostId, signaling }) {
    super();
    this.roomId = roomId;
    this.peerId = peerId;
    this.isHost = isHost;
    this.hostId = hostId;
    this._sig = signaling;
    this._peers = new Map();  // peerId -> Peer
    this._peerInfo = new Map(); // peerId -> { peerId, isHost }
    this._usingRelay = false;

    signaling.on('peer-joined', ({ roomId: rid, peerId: pid }) => {
      if (rid !== roomId) return;
      this._addPeer(pid);
    });
    signaling.on('peer-left', ({ roomId: rid, peerId: pid }) => {
      if (rid !== roomId) return;
      this._removePeer(pid);
    });
    signaling.on('offer', ({ roomId: rid, from, sdp }) => {
      if (rid !== roomId) return;
      this._onOffer(from, sdp);
    });
    signaling.on('answer', ({ roomId: rid, from, sdp }) => {
      if (rid !== roomId) return;
      this._onAnswer(from, sdp);
    });
    signaling.on('ice-candidate', ({ roomId: rid, from, candidate }) => {
      if (rid !== roomId) return;
      this._peers.get(from)?.addICE(candidate);
    });
    signaling.on('relay', ({ roomId: rid, from, payload }) => {
      if (rid !== roomId) return;
      this._usingRelay = true;
      this.emit('relay-active', true);
      this._handleMsg(payload);
    });
  }

  get peers() { return Array.from(this._peerInfo.values()); }

  send(payload, type = 'custom', to) {
    const msg = { type, from: this.peerId, to, payload, timestamp: Date.now() };
    if (to) {
      if (this._peers.get(to)?.send(msg)) return true;
      this._sig.sendRelay(this.roomId, to, msg);
      return false;
    }
    // broadcast
    if (this.isHost) {
      this._peerInfo.forEach((_, pid) => {
        if (!this._peers.get(pid)?.send(msg))
          this._sig.sendRelay(this.roomId, pid, msg);
      });
    } else {
      if (!this._peers.get(this.hostId)?.send(msg))
        this._sig.sendRelay(this.roomId, this.hostId, msg);
    }
    return true;
  }

  leave() {
    this._peers.forEach(p => p.close());
    this._peers.clear();
    this._peerInfo.clear();
  }

  async _addPeer(pid) {
    if (!this.isHost) return;
    const p = this._makePeer(pid);
    const offer = await p.createOffer();
    this._sig.sendOffer(this.roomId, pid, offer);
  }

  async _onOffer(from, sdp) {
    const p = this._makePeer(from);
    const answer = await p.createAnswer(sdp);
    this._sig.sendAnswer(this.roomId, from, answer);
  }

  async _onAnswer(from, sdp) {
    await this._peers.get(from)?.applyAnswer(sdp);
  }

  _makePeer(pid) {
    const p = new Peer(pid);
    p.on('ice', (c) => this._sig.sendIce(this.roomId, pid, c));
    p.on('connected', () => {
      this._peerInfo.set(pid, { peerId: pid, isHost: pid === this.hostId });
      this.emit('peer-joined', { peerId: pid, isHost: pid === this.hostId });
      if (!this.isHost) this.emit('connected', { roomId: this.roomId, peerId: this.peerId });
    });
    p.on('disconnected', () => {
      this._removePeer(pid);
    });
    p.on('message', (msg) => this._handleMsg(msg));
    this._peers.set(pid, p);
    return p;
  }

  _removePeer(pid) {
    this._peers.get(pid)?.close();
    this._peers.delete(pid);
    this._peerInfo.delete(pid);
    this.emit('peer-left', { peerId: pid });
  }

  _handleMsg(msg) {
    if (msg.type === 'ping') { this.send(null, 'pong', msg.from); return; }
    if (msg.type === 'pong') return;
    if (this.isHost && !msg.to) {
      this._peerInfo.forEach((_, pid) => {
        if (pid !== msg.from) {
          if (!this._peers.get(pid)?.send(msg))
            this._sig.sendRelay(this.roomId, pid, msg);
        }
      });
    }
    this.emit('message', msg);
  }
}

// ── ChatPlugin ────────────────────────────────────────────────────────────────
class ChatPlugin extends EventEmitter {
  constructor(room) {
    super();
    this._room = room;
    this._history = [];
    room.on('message', (msg) => {
      if (msg.type !== 'chat') return;
      const m = { id: msg.payload.id, from: msg.from, text: msg.payload.text, timestamp: msg.timestamp };
      this._history.push(m);
      this.emit('message', m);
    });
  }
  send(text, to) {
    this._room.send({ text, id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}` }, 'chat', to);
  }
  get history() { return [...this._history]; }
}

// ── P2PCore ───────────────────────────────────────────────────────────────────
class P2PCore {
  constructor({ signalingUrl }) {
    this._sig = new SignalingClient(signalingUrl);
  }

  async createRoom(opts = {}) {
    return new Promise((resolve, reject) => {
      const roomId = opts.roomId ?? crypto.randomUUID();
      const onCreated = ({ roomId: rid, peerId }) => {
        if (rid !== roomId) return;
        const room = new Room({ roomId: rid, peerId, isHost: true, hostId: peerId, signaling: this._sig });
        room.emit('connected', { roomId: rid, peerId });
        resolve(room);
      };
      this._sig.once('room-created', onCreated);
      this._sig.once('error', ({ message }) => reject(new Error(message)));
      this._ensureConnected().then(() => this._sig.createRoom({ ...opts, roomId })).catch(reject);
    });
  }

  async joinRoom(roomId, opts = {}) {
    return new Promise((resolve, reject) => {
      const onJoined = (p) => {
        if (p.roomId !== roomId) return;
        const room = new Room({ roomId: p.roomId, peerId: p.peerId, isHost: false, hostId: p.hostId, signaling: this._sig });
        // trigger peer creation for existing peers in room (host will send offers)
        resolve(room);
      };
      this._sig.once('room-joined', onJoined);
      this._sig.once('error', ({ message }) => reject(new Error(message)));
      this._ensureConnected().then(() => this._sig.joinRoom(roomId, opts.password)).catch(reject);
    });
  }

  async listRooms() {
    return new Promise((resolve, reject) => {
      this._sig.once('rooms-list', ({ rooms }) => resolve(rooms));
      this._sig.once('error', ({ message }) => reject(new Error(message)));
      this._ensureConnected().then(() => this._sig.listRooms()).catch(reject);
    });
  }

  _ensureConnected() {
    if (this._sig.isConnected) return Promise.resolve();
    return this._sig.connect();
  }
}

// ─── UI logic ─────────────────────────────────────────────────────────────────
let p2p = null;
let room = null;
let chat = null;
let myPeerId = '';

const $ = (id) => document.getElementById(id);

function setStatus(text, state = '') {
  $('status-text').textContent = text;
  $('dot').className = 'dot ' + state;
}

function addMessage(from, text, mine) {
  const el = document.createElement('div');
  el.className = 'msg ' + (mine ? 'mine' : 'theirs');
  const short = from.slice(0, 8);
  el.innerHTML = `<div class="meta">${mine ? 'You' : short}</div>${escHtml(text)}`;
  $('messages').appendChild(el);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function renderPeers() {
  const list = $('peers-list');
  if (!room) { list.innerHTML = ''; return; }
  list.innerHTML = room.peers.map(p =>
    `<span class="peer-chip">${p.peerId.slice(0,8)}${p.isHost ? ' 👑' : ''}</span>`
  ).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function openRoom(r, isHost) {
  room = r;
  myPeerId = r.peerId;
  chat = new ChatPlugin(r);

  $('setup-card').style.display = 'none';
  $('room-card').style.display = 'block';
  $('room-label').textContent = r.roomId.slice(0, 20) + (r.roomId.length > 20 ? '…' : '');
  $('role-badge').textContent = isHost ? 'host' : 'client';
  $('role-badge').className = 'badge ' + (isHost ? 'host' : 'client');

  const url = `${location.origin}${location.pathname}?room=${r.roomId}`;
  $('room-url').textContent = url;
  $('room-url').onclick = () => { navigator.clipboard.writeText(url); $('room-url').textContent = '✅ Copied!'; setTimeout(() => { $('room-url').textContent = url; }, 1500); };

  renderPeers();
  setStatus(`Room: ${r.roomId.slice(0,12)}…`, 'connected');

  r.on('peer-joined', () => renderPeers());
  r.on('peer-left', () => renderPeers());
  r.on('relay-active', () => { $('relay-note').style.display = 'block'; });

  chat.on('message', (m) => addMessage(m.from, m.text, m.from === myPeerId));
}

$('btn-create').onclick = async () => {
  const url = $('server-url').value.trim();
  if (!url) return;
  setStatus('Creating room…', 'connecting');
  try {
    p2p = new P2PCore({ signalingUrl: url });
    const r = await p2p.createRoom();
    openRoom(r, true);
    addMessage('system', `Room created! Share the URL above.`, true);
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  }
};

$('btn-join').onclick = async () => {
  const url = $('server-url').value.trim();
  const rid = $('room-id-input').value.trim();
  if (!url || !rid) return;
  setStatus('Joining room…', 'connecting');
  try {
    p2p = new P2PCore({ signalingUrl: url });
    const r = await p2p.joinRoom(rid);
    openRoom(r, false);
    addMessage('system', `Joined room! Waiting for WebRTC connection…`, false);
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  }
};

$('btn-list').onclick = async () => {
  const url = $('server-url').value.trim();
  if (!url) return;
  try {
    if (!p2p) p2p = new P2PCore({ signalingUrl: url });
    const rooms = await p2p.listRooms();
    $('rooms-list-container').style.display = 'block';
    if (!rooms.length) {
      $('rooms-list').innerHTML = '<p style="color:var(--muted);font-size:.9rem">No public rooms found.</p>';
    } else {
      $('rooms-list').innerHTML = rooms.map(r =>
        `<div style="display:flex;align-items:center;gap:10px;padding:8px;background:var(--surface2);border-radius:8px;margin-bottom:6px;">
          <span style="flex:1;font-size:.9rem">${r.roomId.slice(0,16)}… <span style="color:var(--muted)">(${r.peerCount}/${r.maxPeers})</span>${r.hasPassword ? ' 🔒' : ''}</span>
          <button onclick="joinFromList('${r.roomId}')">Join</button>
        </div>`
      ).join('');
    }
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  }
};

window.joinFromList = (roomId) => {
  $('room-id-input').value = roomId;
  $('btn-join').click();
};

$('btn-send').onclick = sendMsg;
$('msg-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });

function sendMsg() {
  const text = $('msg-input').value.trim();
  if (!text || !chat) return;
  addMessage(myPeerId, text, true);
  chat.send(text);
  $('msg-input').value = '';
}

$('btn-leave').onclick = () => {
  room?.leave();
  room = null; chat = null;
  $('room-card').style.display = 'none';
  $('setup-card').style.display = 'block';
  $('messages').innerHTML = '';
  setStatus('Not connected');
};

// Auto-join from URL param
const params = new URLSearchParams(location.search);
if (params.get('room')) {
  $('room-id-input').value = params.get('room');
}
</script>
</body>
</html>
